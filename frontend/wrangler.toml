# Wrangler config template for Cloudflare Pages + Functions

name = "adultedu"
compatibility_date = "2025-12-19"

# Pages configuration
pages_build_output_dir = "./dist"

# Notes:
# - Replace `account_id` and `project_name` with your Cloudflare account/project values.
# - Deploy with: `WRANGLER_PROJECT=my-pages-project npx wrangler pages publish ./dist --project-name "$WRANGLER_PROJECT" --branch main`

[vars]
API_ORIGIN = "https://backend-production-bec9d.up.railway.app"

# Natural English voice (Kokoro). The model files are served from R2 by
# functions/api/kokoro-model. The bucket is in the same Cloudflare account as this Pages
# project (verified). If the binding is ever removed, the Listen button simply keeps using
# the browser voice. See docs/natural-voice.md.
[[r2_buckets]]
binding = "MODEL_STORE"
bucket_name = "demiwuraks2-app-audio"
